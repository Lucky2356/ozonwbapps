# Деплой на сервер (VPS) по SSH. ОПЦИОНАЛЬНО и ТОЛЬКО вручную (workflow_dispatch),
# чтобы ничего не выкатывалось само. Сервер сам делает git pull и пересобирает образы —
# локальная машина не задействована.
#
# Нужные секреты репозитория (Settings -> Secrets and variables -> Actions):
#   SSH_HOST      — IP/домен сервера
#   SSH_USER      — пользователь SSH (например, deploy)
#   SSH_KEY       — приватный SSH-ключ (весь текст, с BEGIN/END)
#   DEPLOY_PATH   — путь до репозитория на сервере (например, /opt/ozonwbapps)
#
# На сервере заранее: установлен Docker + compose-plugin, склонирован репозиторий
# в DEPLOY_PATH, заполнен .env (в т.ч. DOMAIN и секреты). Первый деплой — руками.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
