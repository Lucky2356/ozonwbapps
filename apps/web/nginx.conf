server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: все маршруты отдаём через index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Кеширование статики.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }
}
